[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "store-replenishment"
version = "0.1.0"
description = "Store-floor replenishment: a shelf demand forecast and a pick-list planner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhiraj Chhetri" }]
dependencies = [
  "boto3>=1.34",
  "fastapi>=0.115",
  "lightgbm>=4.3",
  "mangum>=0.17",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.6",
  "strands-agents>=1.20",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
replenish = "replenishment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "sagemaker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
