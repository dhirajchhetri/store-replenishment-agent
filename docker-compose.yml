services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REPLENISHMENT_DATA_DIR: /data
      REPLENISHMENT_LLM: stub
    volumes:
      - replenishment-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  replenishment-data:
